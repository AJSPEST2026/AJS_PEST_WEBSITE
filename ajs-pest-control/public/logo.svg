<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
    <linearGradient id="pestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  
  <!-- Blue Circle Background -->
  <circle cx="100" cy="85" r="78" fill="url(#circleGrad)"/>
  
  <!-- White arc highlight -->
  <path d="M 35 55 Q 60 25, 100 20 Q 140 15, 165 55" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Letter A -->
  <text x="42" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="65" fill="white" letter-spacing="-2">A</text>
  
  <!-- Letter J (slightly overlapping) -->
  <text x="82" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="65" fill="white" letter-spacing="-2">J</text>
  
  <!-- Letter S -->
  <text x="118" y="110" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="65" fill="white" letter-spacing="-2">S</text>

  <!-- Pest / Grasshopper silhouette on top of J -->
  <g transform="translate(88, 38) scale(0.55)" fill="url(#pestGrad)">
    <!-- Body -->
    <ellipse cx="30" cy="25" rx="18" ry="8" transform="rotate(-20 30 25)"/>
    <!-- Head -->
    <circle cx="50" cy="15" r="7"/>
    <!-- Antennae -->
    <path d="M 53 10 Q 60 -5, 70 -8" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 55 12 Q 65 0, 75 2" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Back legs -->
    <path d="M 20 30 Q 5 50, 15 60" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
    <path d="M 15 28 Q 0 45, 8 58" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round"/>
    <!-- Front legs -->
    <path d="M 40 28 Q 50 40, 55 50" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 35 30 Q 42 42, 48 52" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Wings -->
    <path d="M 25 18 Q 30 5, 42 8" fill="rgba(76,175,80,0.4)" stroke="#4CAF50" stroke-width="1.5"/>
  </g>

  <!-- PEST CONTROL text -->
  <text x="100" y="182" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="18" letter-spacing="1.5">
    <tspan fill="#1565C0">PEST </tspan><tspan fill="#4CAF50">CONTROL</tspan>
  </text>
  
  <!-- SOLUTIONS text -->
  <text x="100" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#555" letter-spacing="4">SOLUTIONS</text>
</svg>
